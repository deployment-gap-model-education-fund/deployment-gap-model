name: Build and deploy docs
on:
  push:
    branches:
      # TODO: uncomment `main` branch and remove docs-update once docs PR is merged
      - docs-update
      # - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    env:
      GEOCODIO_API_KEY: ${{ secrets.GEOCODIO_API_KEY }}
      API_KEY_GOOGLE_MAPS: ${{ secrets.API_KEY_GOOGLE_MAPS }}
      GITHUB_REF: ${{ github.ref_name }}
      PROD_POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
      PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
      PROD_POSTGRES_HOST: ${{ secrets.PROD_POSTGRES_HOST }}
      DATA_DIR: "./data"
      PUDL_VERSION: stable
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: make build_docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
